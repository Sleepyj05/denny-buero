<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenten-Büro · Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#07080d;--bg1:#0b0d14;--bg2:#10131c;--bg3:#161a26;--bg4:#1e2333;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--tx:#e8ebf3;--tx2:#a2a9bd;--tx3:#666e85;--brain:#ff8a4c;--ok:#34d399;--warn:#f5a524;--err:#f87171;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--tx)}
select option{background:#10131c}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#090b11;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd3b0,#ff8a4c 45%,#b2401a 80%);box-shadow:0 0 18px rgba(255,138,76,.55);flex:none;animation:orb 3s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 30px rgba(255,138,76,.9)}}
.brand-name{font-weight:800;font-size:14px;letter-spacing:-.2px;white-space:nowrap}
.brand-sub{font-size:10.5px;color:var(--tx3)}
.pro{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:linear-gradient(90deg,#ff8a4c,#f5a524);color:#1a0d05}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-left:8px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--tx2);font-weight:600;font-size:12.5px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--bg4);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.search-btn{flex:1;max-width:340px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--tx3);margin:0 auto}
.search-btn:hover{border-color:var(--line2)}
kbd{font:10.5px var(--mono);background:var(--bg4);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--tx2)}
.top-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--bg3);padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--bg4)}
.btn-primary{border:0;background:var(--brain);color:#1b0c04;padding:8px 14px;border-radius:9px;font-weight:700;font-size:12.5px}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5;padding:7px 12px;border-radius:9px;font-weight:600}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--bg3);border-radius:9px;font-size:14px;color:var(--tx2);flex:none}
.icon-btn:hover{color:var(--tx);background:var(--bg4)}
.mode-pill{border:1px solid var(--line2);background:var(--bg2);border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mode-pill .d{width:7px;height:7px;border-radius:50%}
.main{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:0;position:relative}
.side{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-scroll{overflow:auto;flex:1;padding:6px 8px 12px}
.side-search{padding:12px 12px 6px}
.input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
.input:focus{border-color:rgba(255,138,76,.55)}
textarea.input{resize:vertical;min-height:70px;line-height:1.5}
.side-brain{display:flex;align-items:center;gap:10px;margin:6px 4px 10px;padding:10px;border-radius:11px;background:linear-gradient(135deg,rgba(255,138,76,.13),rgba(255,138,76,.02));border:1px solid rgba(255,138,76,.22);cursor:pointer}
.side-brain:hover{border-color:rgba(255,138,76,.45)}
.mini-orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd3b0,#ff8a4c 45%,#b2401a 85%);flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px;color:var(--tx3);font-size:11px;font-weight:700}
.sec-h button{border:0;background:transparent;color:var(--tx2);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.sec-h button:hover{background:var(--bg3);color:var(--tx)}
.dg{margin-bottom:2px}
.dg-h{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:700}
.dg-h:hover{background:var(--bg2)}
.dg-h .bar{width:3px;height:16px;border-radius:2px;flex:none}
.dg-h .cnt{margin-left:auto;color:var(--tx3);font:11px var(--mono)}
.dg-h .chev{color:var(--tx3);font-size:10px;width:14px;text-align:center;transition:transform .15s}
.dg.closed .chev{transform:rotate(-90deg)}
.dg.closed .dg-l{display:none}
.wi{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 24px;border-radius:8px;cursor:pointer}
.wi:hover{background:var(--bg2)}
.wi.sel{background:var(--bg3);box-shadow:inset 0 0 0 1px var(--line2)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line2);flex:none;position:relative;background:var(--bg3)}
.av.lg{width:46px;height:46px;font-size:22px}
.wi .nm{font-weight:600;line-height:1.25}
.wi .rl{color:var(--tx3);font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .meta{min-width:0;flex:1}
.sd{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.ub{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--brain);color:#1b0c04;font:700 10px/17px var(--font);text-align:center}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;color:var(--tx3);font-size:11px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#city{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5;transition:right .3s}
@media (min-width:901px){.stage.dr-open .hud{right:474px}}
.feed{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:5px;z-index:5;max-width:min(440px,60%);pointer-events:none}
.feed div{background:rgba(12,14,21,.84);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--tx2);backdrop-filter:blur(6px);animation:fin .3s ease}
.feed b{color:var(--tx);font-family:var(--mono);font-weight:500}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--tx3);background:rgba(12,14,21,.75);border:1px solid var(--line);padding:5px 12px;border-radius:20px;z-index:4;pointer-events:none;white-space:nowrap;transition:opacity .6s}
.tip{position:absolute;pointer-events:none;z-index:6;background:rgba(14,16,24,.96);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12px;display:none;max-width:250px}
.tip .t1{font-weight:700}.tip .t2{color:var(--tx3);font-size:11px}
.view{position:absolute;inset:0;overflow:auto;background:var(--bg);display:none;z-index:8}
.view.on{display:block}
.vwrap{max-width:1180px;margin:0 auto;padding:28px 28px 60px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--bg1);border-left:1px solid var(--line2);transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:20;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.drawer.open{transform:none}
.dw-head{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px}
.dw-title{flex:1;min-width:0}
.dw-name{font-size:17px;font-weight:800;letter-spacing:-.3px}
.dw-sub{color:var(--tx2);font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.dw-status{font-size:11px;color:var(--tx3);margin-top:5px;display:flex;align-items:center;gap:6px}
.dw-actions{display:flex;gap:6px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 10px;color:var(--tx3);font-weight:700;font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-color:var(--brain)}
.dw-body{flex:1;overflow:auto;padding:14px 16px;min-height:0}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;max-width:92%;animation:fin .25s ease}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .bub{padding:9px 12px;border-radius:12px;line-height:1.55;font-size:13px;overflow-wrap:anywhere;min-width:0}
.m.ag .bub{background:var(--bg3);border:1px solid var(--line);border-top-left-radius:4px}
.m.me .bub{background:#2a2f45;border:1px solid rgba(255,255,255,.08);border-top-right-radius:4px}
.m .av{width:26px;height:26px;font-size:13px}
.m .tm{font-size:10px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;align-items:center}
.m .acts{display:none;gap:4px}
.m:hover .acts{display:flex}
.acts button{border:0;background:transparent;color:var(--tx3);font-size:11px;padding:0 3px}
.acts button:hover{color:var(--tx)}
.bub b{color:#fff}.bub code{font:12px var(--mono);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px}
.bub pre{font:12px var(--mono);background:rgba(0,0,0,.3);padding:8px;border-radius:7px;white-space:pre-wrap;margin:4px 0}
.bub h4{margin:6px 0 2px;font-size:13px}
.bub blockquote{margin:4px 0;padding:4px 10px;border-left:2px solid var(--brain);color:var(--tx2)}
.note{align-self:center;font-size:11px;color:var(--tx3);background:var(--bg2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;max-width:90%;text-align:center}
.hand{border:1px solid var(--line2);border-radius:12px;background:linear-gradient(135deg,rgba(255,138,76,.08),transparent);padding:10px 12px;max-width:95%;animation:fin .25s ease}
.hand .hh{font-size:11px;font-weight:700;color:var(--brain);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.typing{display:inline-flex;gap:4px;padding:12px 14px!important}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:tb 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--bg1)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.quick button{flex:none;border:1px solid var(--line2);background:var(--bg2);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--tx2)}
.quick button:hover{color:var(--tx);border-color:rgba(255,138,76,.45)}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;resize:none;min-height:42px;max-height:140px;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none;line-height:1.45}
.comp-row textarea:focus{border-color:rgba(255,138,76,.55)}
.send{width:42px;height:42px;border:0;border-radius:11px;background:var(--brain);color:#1b0c04;font-size:18px;font-weight:800;flex:none}
.comp-tools{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.comp-tools button{border:0;background:transparent;color:var(--tx3);font-size:11.5px;padding:3px 6px;border-radius:6px}
.comp-tools button:hover{background:var(--bg3);color:var(--tx)}
.comp-tools .sp{margin-left:auto;font-size:10.5px;color:var(--tx3)}
.dlg{border:1px solid rgba(255,138,76,.3);background:rgba(255,138,76,.05);border-radius:11px;padding:10px;margin-bottom:9px;display:grid;gap:7px}
.dlg .lb{font-size:11px;font-weight:700;color:var(--brain)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.sw button.on{border-color:#fff}
.emo{display:flex;flex-wrap:wrap;gap:4px}
.emo button{width:31px;height:31px;border:1px solid var(--line);background:var(--bg2);border-radius:7px;font-size:15px;padding:0}
.emo button:hover{border-color:var(--line2);background:var(--bg3)}
.emo button.on{border-color:var(--brain);background:rgba(255,138,76,.12)}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:6px;cursor:pointer}
.list-row:hover{border-color:var(--line2)}
.task{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:6px}
.tchk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:transparent;flex:none;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px}
.st-doing .tchk{border-color:var(--warn);color:var(--warn)}
.st-done .tchk{background:var(--ok);border-color:var(--ok);color:#06281c}
.st-done .tt .ti{text-decoration:line-through;color:var(--tx3)}
.tt{flex:1;min-width:0}.tt .ti{font-weight:600}.tt .tr{font-size:11.5px;color:var(--tx3);margin-top:3px}
.tbtn{border:0;background:transparent;color:var(--tx3);padding:2px 6px;border-radius:6px}
.tbtn:hover{background:var(--bg3);color:var(--tx)}
.empty{color:var(--tx3);text-align:center;padding:26px 10px;font-size:12.5px;line-height:1.6}
.mem{padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--brain);border-radius:0 9px 9px 0;background:var(--bg2);margin-bottom:6px;display:flex;gap:8px}
.mem div{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.modal-bg,.palette-bg{position:fixed;inset:0;background:rgba(3,4,8,.66);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.on,.palette-bg.on{display:flex}
.modal{background:var(--bg1);border:1px solid var(--line2);border-radius:16px;width:580px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:16px}
.mb{padding:16px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.palette{width:580px;max-width:100%;background:var(--bg1);border:1px solid var(--line2);border-radius:14px;overflow:hidden;align-self:flex-start;margin-top:10vh}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 16px;font-size:15px;outline:none}
#palList{max-height:50vh;overflow:auto;padding:6px}
.pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.pi.on,.pi:hover{background:var(--bg3)}
.pi .k{margin-left:auto;font-size:10.5px;color:var(--tx3)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:68px;align-items:center;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--brain);padding:10px 14px;border-radius:10px;font-size:12.5px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fin .25s ease}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.vh h1{margin:0;font-size:26px;letter-spacing:-.6px;font-weight:800}
.vh p{margin:4px 0 0;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg1);border:1px solid var(--line);border-radius:13px;padding:14px}
.kpi .v{font:600 24px var(--mono);letter-spacing:-1px}
.kpi .l{font-size:11.5px;color:var(--tx3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 12px;font-size:14px}
.dt{width:100%;border-collapse:collapse}
.dt td,.dt th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}
.dt th{color:var(--tx3);font-weight:700;font-size:11px}
.dt tr:last-child td{border-bottom:0}
.dt tr.cl{cursor:pointer}.dt tr.cl:hover td{background:var(--bg2)}
.load{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;min-width:80px}
.load i{display:block;height:100%;border-radius:4px}
.fi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fi:last-child{border-bottom:0}
.fi .ft{color:var(--tx3);font:11px var(--mono);flex:none;width:42px;padding-top:1px}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kbc{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:320px;transition:border-color .15s}
.kbc.over{border-color:rgba(255,138,76,.6)}
.kbc h3{margin:2px 4px 12px;font-size:13px;display:flex;justify-content:space-between}
.kbk{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.kbk:hover{border-color:var(--line2)}
.kbk .kt{font-weight:600;margin-bottom:7px}
.kbk .kw{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx2)}
.lg-row{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.lg-ty{font:10px var(--mono);padding:1px 6px;border-radius:5px;background:var(--bg3);color:var(--tx2);flex:none;width:78px;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line2);background:var(--bg2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--tx2);font-weight:600}
.filters button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.chk:hover{background:var(--bg2)}
.help li{margin-bottom:6px;color:var(--tx2)}.help b{color:var(--tx)}
.only-m{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.search-btn{display:none}}

function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`;}
function md(s){

function apiMsgs(chat){
  const out=[];
  for(const m of chat){let role,content;
    if(m.role==='user'){role='user';content=m.text;}
    else if(m.role==='agent'){role='assistant';content=m.text;}
    else if(m.role==='handoff'){role='user';const f=W(m.from)||{name:'Kollege'};content=`[${m.dir==='back'?'Antwort':'Nachricht'} von ${f.name}${f.role?' – '+f.role:''}]\n${m.text}`;}
    else if(m.role==='image'){role='assistant';content=`[Ich habe ein Bild erstellt: ${m.prompt}]`;}
    else if(m.role==='auto'){role='user';content=`[Automation „${m.name}“: ${m.status==='ok'?'erfolgreich':m.status==='err'?'Fehler':'Simulation'}] ${m.text}`;}
    else continue;
    if(!content)continue;
    if(out.length&&out[out.length-1].role===role)out[out.length-1].content+='\n\n'+content;else out.push({role,content});}
  let r=out.slice(-24);while(r.length&&r[0].role!=='user')r.shift();return r;
}

    body:JSON.stringify({model:model||modelName(),max_tokens:+S.settings.maxTokens||1024,system,messages})});
  const txt=await res.text();let data;try{data=JSON.parse(txt);}catch(_){throw new Error('HTTP '+res.status);}
  if(!res.ok)throw new Error((data.error&&data.error.message)||('HTTP '+res.status));

}

  for(let r=0;r<rounds;r++)for(const id of ids){const w=W(id);if(!w)continue;
    const tr=m.transcript.map(x=>`${W(x.id)?.name}: ${x.text}`).join('\n\n');
    const prompt=`Wir sind im Meeting zum Thema: "${topic}".\nTeilnehmer: ${ids.map(x=>W(x)?.name+' ('+W(x)?.role+')').join(', ')}.\n${tr?'Bisheriger Verlauf:\n'+tr+'\n\n':''}Runde ${r+1} von ${rounds}. Gib deinen Beitrag aus Sicht deiner Rolle: maximal 4 Sätze, konkret, gern mit Zahlen. Gehe auf Vorredner ein.`;
    const text=await oneShot(w,prompt,()=>{const st=stepsFor(w);return`Aus Sicht ${w.role}: ${st[r%3]} – bezogen auf „${short(topic,50)}“. ${r>0?'Ich stimme dem Vorschlag von '+(W(ids[(ids.indexOf(id)+n-1)%n])?.name||'vorhin')+' zu und ergänze das.':'Ich schlage vor, damit diese Woche zu starten.'}`;});
    m.transcript.push({id,text,round:r});bubble(w,short(text,36),4200);save();refreshMeeting();}
  const tr=m.transcript.map(x=>`${W(x.id)?.name} (${W(x.id)?.role}): ${x.text}`).join('\n\n');
  m.summary=await oneShot(S.brain,`Fasse dieses Meeting zum Thema "${topic}" für ${S.settings.user} zusammen: 1) Kernaussagen, 2) Entscheidungen, 3) nächste Schritte mit Verantwortlichen.\n\n${tr}`,
    ()=>`**Kernaussagen**\n${m.transcript.filter(x=>x.round===0).map(x=>`• **${W(x.id)?.name}:** ${short(x.text,110)}`).join('\n')}\n\n**Nächste Schritte**\n${ids.map(id=>`• ${W(id)?.name}: ${stepsFor(W(id))[0]}`).join('\n')}`);
  m.status='done';ids.forEach(id=>W(id)&&burst(id,'#ff8a4c'));save();refreshMeeting();addLog('meeting',`Meeting beendet: ${short(topic,50)}`);
  toast('👥 Meeting beendet – Zusammenfassung liegt bei '+esc(S.brain.name),'ok');
  await Promise.all(ids.map(id=>{const w=W(id);if(!w)return null;return goHome(w).then(()=>{rt(w).task=null;});}));
}

function addTask(w,title){const t={id:uid('t'),title,status:'open',created:Date.now(),result:''};w.tasks.unshift(t);addLog('task',`Neue Aufgabe für ${w.name}: ${short(title,60)}`);return t;}
async function runTask(w,t){
  if(rt(w).busy){toast(esc(w.name)+' arbeitet gerade noch …');return;}
  t.status='doing';refreshTasks();bubble(w,'🛠 '+short(t.title,26),2500);
  pushMsg(w,{role:'user',text:'Aufgabe: '+t.title});
  const rep=stripDel(await respond(w,{}));pushMsg(w,{role:'agent',text:rep});
  t.result=rep;t.status='done';burst(w.id,'#34d399');fx(w.id,'✅ +'+S.sales.minTask+' min','#34d399');addLog('task',`${w.name} hat erledigt: ${short(t.title,60)}`);toast(`✅ <b>${esc(w.name)}</b>: „${esc(short(t.title,40))}“ erledigt`,'ok');refreshTasks();if(S.manager.enabled&&S.manager.reviewTasks)requestReview(w,{kind:'text',title:t.title,text:rep});
}

function moveWorker(w,did){
  if(!w||w.deptId===did)return;if(team(did).length>=9){toast('Diese Abteilung ist voll (max. 9).','err');renderDrawer();return;}
  const old=D(w.deptId)?.name;w.deptId=did;goHome(w);placeAll();addLog('dept',`${w.name} wechselt von ${old} zu ${D(did).name}`);save();renderDrawer();renderSidebar();
}

function meetingsHtml(){

const AUTO_RE=/<<AUTOMATION\s+name="([^"]+)">>([\s\S]*?)<<\/AUTOMATION>>/g;
function parseAuto(t){const out=[];let m;AUTO_RE.lastIndex=0;while((m=AUTO_RE.exec(t||''))){const n=m[1].trim().toLowerCase();const a=S.automations.find(x=>x.enabled&&x.name.toLowerCase()===n);if(a)out.push({a,payload:m[2].trim()});}return out;}
function detectAuto(text){const t=text.toLowerCase();
  const hits=S.automations.filter(a=>a.enabled&&String(a.keywords||'').split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).some(k=>t.includes(k)));
  if(hits.length)return hits;
  if(/\bn8n\b|automatisier|\bworkflow\b|webhook/.test(t)){const d=S.automations.find(a=>a.enabled&&a.url)||S.automations.find(a=>a.enabled);return d?[d]:[];}
  return[];}
function collectAutos(userText,reply){const ai=parseAuto(reply);if(ai.length)return ai;return detectAuto(userText).map(a=>({a,payload:null}));}
async function runAutomation(a,payload,ent,userText){
  const id=ent.id,hr=rt('hub');S.stats.automations=(S.stats.automations||0)+1;a.runs=(a.runs||0)+1;a.lastRun=Date.now();
  bubble(id,'⚡ '+a.name,2500);await packet(id,'hub','#facc15');hr.busy=true;bubble('hub','⚡ '+a.name,2500);
  let status='sim',result='';
  if(a.url){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
      const res=await fetch(a.url,{method:'POST',headers:{'content-type':'application/json'},signal:ctl.signal,
        body:JSON.stringify({automation:a.name,text:payload,request:userText||'',from:{name:ent.name,role:ent.role||'',department:D(ent.deptId)?.name||'Gehirn'},company:S.settings.company,user:S.settings.user,timestamp:new Date().toISOString()})});
      clearTimeout(to);const raw=await res.text();if(!res.ok)throw new Error('HTTP '+res.status+(raw?': '+short(raw,80):''));
      let msg=raw;try{const j=JSON.parse(raw),o=Array.isArray(j)?j[0]:j;msg=(o&&(o.reply||o.message||o.text||o.output||o.result))||JSON.stringify(o);}catch(_){}
      status='ok';result=String(msg||'Workflow ausgeführt.');}
    catch(e){status='err';result=e.name==='AbortError'?'Zeitüberschreitung – n8n hat nicht geantwortet.':e.message+' (Webhook-URL, CORS-Einstellung und ob der Workflow aktiv ist prüfen)';}}
  else{await sleep(1200/(+S.settings.speed||1));result=`Simulation – für „${a.name}“ ist noch keine Webhook-URL hinterlegt. Mit URL würde jetzt der n8n-Workflow starten.`;}
  hr.busy=false;a.lastStatus=status;
  await packet('hub',id,status==='err'?'#f87171':'#34d399');
  pushMsg(ent,{role:'auto',name:a.name,icon:a.icon,status,text:result,payload:short(payload||'',500)});
  fx(id,status==='ok'?'⚡ erledigt':status==='err'?'⚠ Fehler':'⚡ Simulation',status==='err'?'#f87171':'#facc15');if(status==='ok')burst(id,'#facc15');
  addLog('auto',`${a.icon} ${a.name} (${ent.name}): ${status==='ok'?'erfolgreich':status==='err'?'Fehler':'Simulation'}`);
  if(UI.drawer&&UI.drawer.type==='hub')renderDrawer();renderTop();
  return{status,result};
}

function dueRoutine(r,now){if(!r.enabled)return false;if(r.mode==='interval')return now-(r.lastRun||r.created)>=r.every*60000;

const IDB={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('agentenbuero',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},

/* ---------- Bildgenerierung ---------- */
function hashStr(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function imgEmoji(p,w){const t=p.toLowerCase();const map=[[/caf[eé]|kaffee|coffee/,'☕'],[/pizza|burger|essen|restaurant|food|gericht|speise/,'🍽️'],[/auto|car|fahrzeug|wagen/,'🚗'],[/haar|friseur|hair|salon/,'💇'],[/haus|immobil|wohnung|house/,'🏠'],[/sale|rabatt|angebot|deal|%/,'🏷️'],[/baby|windel|pampers/,'🍼'],[/kosmetik|skincare|creme|beauty/,'🧴'],[/sport|fitness|gym/,'🏋️'],[/weihnacht|christmas|advent/,'🎄'],[/handwerk|werkzeug|bau/,'🔨']];for(const[re,e]of map)if(re.test(t))return e;return w&&w.emoji||'✨';}
function demoImage(prompt,w){
  const cv2=document.createElement('canvas');cv2.width=cv2.height=640;const c=cv2.getContext('2d');let seed=hashStr(prompt)||1;
  const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return((seed>>>0)%100000)/100000;};
  const pals=[['#ff8a4c','#8b5cf6','#0ea5e9'],['#f472b6','#facc15','#22d3ee'],['#34d399','#3b82f6','#a855f7'],['#fb7185','#f97316','#fde047'],['#60a5fa','#c084fc','#f472b6']],p=pals[Math.floor(rnd()*pals.length)];
  let g=c.createLinearGradient(0,0,640,640);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);c.fillStyle=g;c.fillRect(0,0,640,640);
  for(let i=0;i<14;i++){const x=rnd()*640,y=rnd()*640,r=40+rnd()*180,gg=c.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,`rgba(255,255,255,${.12+rnd()*.25})`);gg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gg;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
  c.globalAlpha=.2;c.strokeStyle='#fff';for(let i=0;i<6;i++){c.lineWidth=2+rnd()*6;c.beginPath();c.moveTo(rnd()*640,rnd()*640);c.bezierCurveTo(rnd()*640,rnd()*640,rnd()*640,rnd()*640,rnd()*640,rnd()*640);c.stroke();}c.globalAlpha=1;
  c.font='170px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(imgEmoji(prompt,w),320,250);
  c.fillStyle='rgba(10,12,18,.74)';c.beginPath();c.moveTo(58,440);c.arcTo(600,440,600,610,18);c.arcTo(600,610,40,610,18);c.arcTo(40,610,40,440,18);c.arcTo(40,440,600,440,18);c.closePath();c.fill();
  c.fillStyle='#fff';c.font='700 25px Manrope, system-ui, sans-serif';c.textAlign='left';c.textBaseline='alphabetic';
  const words=String(prompt).split(/\s+/);let line='',y=482,lines=0;for(const wd of words){const t=line?line+' '+wd:wd;if(c.measureText(t).width>520){c.fillText(line,64,y);y+=32;lines++;line=wd;if(lines>=3){line='…';break;}}else line=t;}if(lines<3)c.fillText(line,64,y);
  c.fillStyle='rgba(255,255,255,.62)';c.font='600 15px Manrope, system-ui, sans-serif';c.fillText('DEMO-BILD · echte Bild-KI im Tool-Hub einrichten',64,590);
  return cv2.toDataURL('image/jpeg',.88);}
function shrink(src,max=1024){return new Promise(res=>{if(!/^data:image/.test(src||''))return res(src);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.9));}catch(_){res(src);}};im.onerror=()=>res(src);im.src=src;});}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
async function genOpenAI(prompt){const t=S.tools;
  const res=await fetch('https://api.openai.com/v1/images/generations',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+t.openaiKey.trim()},body:JSON.stringify({model:t.openaiModel||'gpt-image-1',prompt,size:t.size||'1024x1024',n:1})});
  const j=await res.json().catch(()=>({}));if(!res.ok)throw new Error((j.error&&j.error.message)||'HTTP '+res.status);
  const d=j.data&&j.data[0];if(d&&d.b64_json)return'data:image/png;base64,'+d.b64_json;if(d&&d.url){try{return await blobToDataUrl(await(await fetch(d.url)).blob());}catch(_){return d.url;}}throw new Error('Keine Bilddaten erhalten');}
async function genWebhook(prompt,w){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),180000);

    if(!res.ok)throw new Error('HTTP '+res.status);const ct=res.headers.get('content-type')||'';if(ct.startsWith('image/'))return await blobToDataUrl(await res.blob());
    const j=await res.json(),o=Array.isArray(j)?j[0]:j;const v=o&&(o.image||o.b64_json||o.base64||o.url||o.imageUrl||(o.data&&o.data[0]&&(o.data[0].b64_json||o.data[0].url)));

/* ================= CLIP-STATION (Ssemble API) ================= */
const SSEMBLE_BASE='https://aiclipping.ssemble.com/api/v1';
function ssHeaders(key){return{'X-API-Key':key,'content-type':'application/json'};}
async function ssJson(res){const txt=await res.text();let j=null;try{j=JSON.parse(txt);}catch(_){}
  if(!res.ok)throw new Error('Ssemble '+res.status+': '+short(((j&&(j.message||j.error||j.detail))||txt||'keine Antwort'),180));
  return j||{};}
async function ssembleCreate(url,key){
  const res=await fetch(SSEMBLE_BASE+'/shorts/create',{method:'POST',headers:ssHeaders(key),
    body:JSON.stringify({video_url:url,url:url,language:'de',number_of_shorts:5})});
  const j=await ssJson(res);
  const id=j.request_id||j.requestId||j.id||(j.data&&(j.data.request_id||j.data.id));
  if(!id)throw new Error('Keine Auftrags-ID erhalten: '+short(JSON.stringify(j),160));
  return id;}
async function ssembleStatus(id,key){
  return await ssJson(await fetch(SSEMBLE_BASE+'/shorts/'+id+'/status',{headers:ssHeaders(key)}));}
async function ssembleGet(id,key){
  return await ssJson(await fetch(SSEMBLE_BASE+'/shorts/'+id,{headers:ssHeaders(key)}));}
function ssShorts(j){
  const a=j.shorts||j.clips||j.results||j.data||j.items;
  if(Array.isArray(a))return a;
  if(a&&Array.isArray(a.shorts))return a.shorts;
  return [];}
function clipUrlOf(c){return c.download_url||c.downloadUrl||c.video_url||c.videoUrl||c.url||c.file_url||'';}
function clipTitleOf(c){return c.title||c.ai_title||c.aiTitle||c.name||c.headline||'';}

async function runClipJob(w,videoUrl,opts){
  const key=(S.tools.ssembleKey||'').trim();
  if(!key){const m='Kein Ssemble-Key hinterlegt \u2013 im Tool-Hub unter Einrichten eintragen.';
    pushMsg(w,{role:'note',text:'\u26a0 '+m});toast('\u2702\ufe0f '+esc(m),'err');return null;}
  const r=rt(w);r.task='clip';
  pushMsg(w,{role:'note',text:'\u2702\ufe0f '+w.name+' geht zur Clip-Station (\u00fcber den Tool-Hub) \u2026'});
  bubble(w,'\u2702\ufe0f zur Clip-Station',2600);
  await walk(w,{type:'site',id:'clips'},SITES.clips.station,'clip');
  const cr=rt('clips');cr.busy=true;r.busy=true;busyChanged(w);
  bubble(w,'\u2702\ufe0f l\u00e4dt Video \u2026',3200);
  let clips=null,err=null,reqId=null;
  try{
    reqId=await ssembleCreate(videoUrl,key);
    pushMsg(w,{role:'note',text:'\u2702\ufe0f Auftrag l\u00e4uft bei Ssemble (ID '+short(String(reqId),24)+') \u2026'});
    for(let i=0;i<120;i++){
      await sleep(5000);
      let st=null;try{st=await ssembleStatus(reqId,key);}catch(e){continue;}
      const sv=String(st.status||st.state||'').toLowerCase();
      const pr=st.progress!=null?Math.round(st.progress):null;
      bubble(w,'\u2702\ufe0f '+(pr!=null?pr+'%':'arbeitet \u2026'),4200);
      if(sv==='completed'||sv==='complete'||sv==='done'||sv==='succeeded'){clips=ssShorts(await ssembleGet(reqId,key));break;}
      if(sv==='failed'||sv==='error')throw new Error(st.error||st.message||'Ssemble meldet: fehlgeschlagen');
    }
    if(!clips)throw new Error('Zeit\u00fcberschreitung \u2013 Ssemble war nach 10 Minuten noch nicht fertig.');
    if(!clips.length)throw new Error('Ssemble hat keine Clips zur\u00fcckgegeben.');
  }catch(e){err=e.message;}
  cr.busy=false;r.busy=false;busyChanged(w);
  if(err){bubble(w,'\u26a0 Fehler',2800);pushMsg(w,{role:'note',text:'\u26a0 Clipping fehlgeschlagen: '+err});
    toast('\u2702\ufe0f '+esc(err),'err');await goHome(w);r.task=null;return null;}
  cr.print=performance.now();bubble(w,'\ud83d\udda8\ufe0f druckt \u00dcbersicht \u2026',1800);await sleep(1800/spd());
  r.carry='folder';await goHome(w);r.carry=null;r.task=null;r.print=performance.now();
  let captions='';
  try{captions=stripDel(await oneShot(w,
    'Schreib f\u00fcr diese '+clips.length+' Kurzvideo-Clips je eine knappe deutsche Caption mit 3-5 Hashtags. Nummeriere sie.\n'
    +clips.map(function(c,i){return 'Clip '+(i+1)+': '+(clipTitleOf(c)||'ohne Titel');}).join('\n'),
    function(){return clips.map(function(c,i){return '**Clip '+(i+1)+'** \u2013 '+(clipTitleOf(c)||'Ausschnitt')+'\n#shorts #reels #content';}).join('\n\n');}));}catch(_){}
  const item={kind:'clips',title:'Clips: '+short(videoUrl,50),url:videoUrl,clips:clips,captions:captions,reqId:reqId};
  pushMsg(w,{role:'clips',clips:clips,captions:captions,url:videoUrl});
  S.stats.clips=(S.stats.clips||0)+clips.length;
  fx(w.id,'\u2702\ufe0f '+clips.length+' Clips','#a78bfa');burst(w.id,'#a78bfa');
  addLog('clip',w.name+' hat '+clips.length+' Clips erstellt aus: '+short(videoUrl,50));save();
  if(UI.drawer&&UI.drawer.type==='tools')renderDrawer();
  if(S.manager.enabled)requestReview(w,{kind:'text',title:item.title,text:clips.length+' Clips erstellt.\n\n'+captions});
  else fileToArchive(w,{kind:'text',title:item.title,text:captions},null);
  return item;}

/* ================= EINGEHENDER WEBHOOK (n8n → Büro) ================= */
(function(){
  const NETLIFY_URL='https://fluffy-dieffenbachia-f93c18.netlify.app';
  // Polling: alle 3 Sekunden schauen ob n8n etwas geschickt hat
  // Wir nutzen localStorage als Brücke – n8n ruft einen kleinen Proxy auf
  // der die Nachricht in den Browser-Storage legt
  // Einfachster Weg: Service Worker / BroadcastChannel
  // Noch einfacher: n8n ruft direkt die Netlify-Funktion auf

  /* ---------- Eingehende Nachrichten verarbeiten ---------- */
  window._handleIncoming=async function(data){
    if(!data||!data.text)return;
    const from=data.from||'Telegram';
    const text=String(data.text).trim();
    if(!text)return;
    // Victoria bekommt die Nachricht
    const m=S.manager;
    if(!m)return;
    addLog('system','📱 Eingehend von '+from+': '+short(text,60));
    pushMsg(m,{role:'user',text:`[Von ${from}]: ${text}`});
    bubble('manager','📱 '+short(text,28),3000);
    // Victoria antwortet
    const reply=stripDel(await respond(m,{}));
    pushMsg(m,{role:'agent',text:reply});
    // Antwort zurück an n8n schicken
    if(S.settings.n8nCallback){
      try{await fetch(S.settings.n8nCallback,{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({reply,from,original:text,manager:m.name,company:S.settings.company,timestamp:new Date().toISOString()})});}
      catch(e){addLog('system','Callback-Fehler: '+e.message);}
    }
    return reply;
  };

  /* ---------- URL-Parameter prüfen (n8n schickt ?msg=...) ---------- */
  function checkUrlMsg(){
    const p=new URLSearchParams(window.location.search);
    const msg=p.get('msg'),from=p.get('from')||'Telegram',cb=p.get('cb');
    if(!msg)return;
    // URL säubern
    window.history.replaceState({},'',window.location.pathname);
    if(cb)S.settings.n8nCallback=decodeURIComponent(cb);
    setTimeout(()=>window._handleIncoming({text:decodeURIComponent(msg),from}),1200);
  }

  /* ---------- Polling via BroadcastChannel (gleiche Domain) ---------- */
  try{const bc=new BroadcastChannel('buero_incoming');bc.onmessage=e=>window._handleIncoming(e.data);}catch(_){}

  /* ---------- MessageEvent von iFrame/Proxy ---------- */
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='buero_msg')window._handleIncoming(e.data);});

  /* ---------- Init ---------- */
  window.addEventListener('load',()=>setTimeout(checkUrlMsg,1500));
})();
